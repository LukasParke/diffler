name: Diffler
description: Generate a profile README and optional inline Remotion input using the bundled Diffler CLI
author: LukasParke

branding:
  icon: file-text
  color: blue

inputs:
  github-token:
    description: GitHub token used only for collection; never written to renderer input
    required: true
  username:
    description: Fallback GitHub username (or reference DIFFLER_GITHUB_USERNAME in your config)
    default: ${{ github.repository_owner }}
  template-dir:
    description: Fallback template directory when using environment configuration
    default: .github/diffler
  config:
    description: Config path relative to working-directory; leave empty for default config discovery
    default: ""
  working-directory:
    description: Consumer project directory relative to github.workspace
    default: .
  output:
    description: README output path relative to working-directory
    default: README.md
  commit-message:
    description: Commit message for generated files
    default: "🤖 Auto-update profile README"
  remotion-output:
    description: Optional output path for typed inline SourceProps (stats, not a filesystem path)
    default: ""
  dry-run:
    description: Generate files without committing or pushing
    default: "false"
  stats-output-path:
    description: Local stats JSON path (not committed by this action)
    default: .diffler/stats.json
  stats-cache-path:
    description: Local stable cache path (not committed by this action)
    default: .diffler/cache-stable.json
  stats-volatile-cache-path:
    description: Local volatile cache path (not committed by this action)
    default: .diffler/cache-volatile.json
  stats-backfill-mode:
    description: Backfill mode for optional REST metrics (resume, refresh, off)
    default: resume
  stats-include-private:
    description: Include private details in local stats only; never enables private Remotion exports
    default: "false"
  collect-stats:
    description: Also write stats JSON before rendering
    default: "false"

outputs:
  changed:
    description: Whether generated README/Remotion files were committed
    value: ${{ steps.render.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Collect stats (optional)
      if: inputs.collect-stats == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DIFFLER_CLI: ${{ github.action_path }}/dist-action/index.js
        DIFFLER_GITHUB_USERNAME: ${{ inputs.username }}
        DIFFLER_TEMPLATE_DIRECTORY: ${{ inputs.template-dir }}
        DIFFLER_CONFIG: ${{ inputs.config }}
        DIFFLER_STATS_OUTPUT: ${{ inputs.stats-output-path }}
        DIFFLER_STATS_CACHE: ${{ inputs.stats-cache-path }}
        DIFFLER_VOLATILE_CACHE: ${{ inputs.stats-volatile-cache-path }}
        DIFFLER_BACKFILL: ${{ inputs.stats-backfill-mode }}
        DIFFLER_PRIVATE: ${{ inputs.stats-include-private }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$DIFFLER_CONFIG" ]; then args+=(--config "$DIFFLER_CONFIG"); fi
        if [ "$DIFFLER_PRIVATE" = "true" ]; then args+=(--include-private); fi
        node "$DIFFLER_CLI" collect "${args[@]}" \
          --output-path "$DIFFLER_STATS_OUTPUT" \
          --cache-path "$DIFFLER_STATS_CACHE" \
          --volatile-cache-path "$DIFFLER_VOLATILE_CACHE" \
          --backfill-mode "$DIFFLER_BACKFILL"

    - name: Render profile README and inline renderer input
      id: render
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DIFFLER_CLI: ${{ github.action_path }}/dist-action/index.js
        DIFFLER_GITHUB_USERNAME: ${{ inputs.username }}
        DIFFLER_TEMPLATE_DIRECTORY: ${{ inputs.template-dir }}
        DIFFLER_CONFIG: ${{ inputs.config }}
        DIFFLER_OUTPUT: ${{ inputs.output }}
        DIFFLER_REMOTION_OUTPUT: ${{ inputs.remotion-output }}
        DIFFLER_DRY_RUN: ${{ inputs.dry-run }}
        DIFFLER_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$DIFFLER_CONFIG" ]; then args+=(--config "$DIFFLER_CONFIG"); fi
        node "$DIFFLER_CLI" render "${args[@]}" --output "$DIFFLER_OUTPUT"
        paths=("$DIFFLER_OUTPUT")
        if [ -n "$DIFFLER_REMOTION_OUTPUT" ]; then
          node "$DIFFLER_CLI" export-remotion "${args[@]}" --output "$DIFFLER_REMOTION_OUTPUT"
          paths+=("$DIFFLER_REMOTION_OUTPUT")
        fi
        if [ "$DIFFLER_DRY_RUN" = "true" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! git diff --cached --quiet; then
          echo "::error::Refusing to commit unrelated staged changes."
          exit 1
        fi
        git add -- "${paths[@]}"
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git -c user.name='github-actions[bot]' \
            -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "$DIFFLER_COMMIT_MESSAGE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Push generated files
      if: steps.render.outputs.changed == 'true' && inputs.dry-run != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      run: git push
