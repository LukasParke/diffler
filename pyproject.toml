[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffler"
dynamic = ["version"]
description = "A powerful, extensible engine for generating and managing GitHub profile READMEs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Diffler Contributors" },
]
keywords = [
    "github",
    "profile",
    "readme",
    "automation",
    "generator",
    "markdown",
    "template",
    "jinja2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-yaml>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pygithub>=2.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
diffler = "diffler.cli:app"

[project.entry-points."diffler.plugins"]

[project.urls]
Homepage = "https://github.com/diffler/diffler"
Documentation = "https://diffler.readthedocs.io"
Repository = "https://github.com/diffler/diffler"
Issues = "https://github.com/diffler/diffler/issues"
Changelog = "https://github.com/diffler/diffler/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/diffler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diffler"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "Q",   # flake8-quotes
    "FLY", # flynt
    "PERF",# perflint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "integration: marks tests as integration tests (hit real APIs)",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src/diffler"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
