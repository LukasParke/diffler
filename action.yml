name: Diffler
description: Render GitHub profile README with live data and optional remotion config
author: LukasParke

branding:
  icon: file-text
  color: blue

inputs:
  github-token:
    description: GitHub token with repo and user read scopes
    required: true
  username:
    description: GitHub username to fetch data for
    required: false
    default: ${{ github.repository_owner }}
  template-dir:
    description: Directory containing Jinja2 templates
    required: false
    default: .github/diffler
  config:
    description: Path to diffler.yml config file
    required: false
    default: .github/diffler.yml
  output:
    description: Output path for rendered README
    required: false
    default: README.md
  commit-message:
    description: Commit message for README updates
    required: false
    default: "🤖 Auto-update profile README"
  remotion-output:
    description: Path to write remotion input.json (disabled if empty)
    required: false
    default: ""
  dry-run:
    description: Render without committing changes
    required: false
    default: "false"

outputs:
  changed:
    description: Whether the README was changed
    value: ${{ steps.render.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install diffler
      shell: bash
      run: |
        pip install diffler

    - name: Render profile README
      id: render
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -n "${{ inputs.username }}" ]; then
          export DIFFLER_GITHUB_USERNAME="${{ inputs.username }}"
        fi

        diffler render --config "${{ inputs.config }}" --output "${{ inputs.output }}"

        if [ -n "${{ inputs.remotion-output }}" ]; then
          echo "Generating remotion config..."
          diffler export-remotion --config "${{ inputs.config }}" --output "${{ inputs.remotion-output }}"
        fi

        if [ "${{ inputs.dry-run }}" = "true" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git add "${{ inputs.output }}"
        if [ -n "${{ inputs.remotion-output }}" ]; then
          git add "${{ inputs.remotion-output }}"
        fi
        git add .github-profile-stats/cache.json 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes to commit."
        else
          git commit -m "${{ inputs.commit-message }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Push changes
      if: steps.render.outputs.changed == 'true' && inputs.dry-run != 'true'
      shell: bash
      run: git push
