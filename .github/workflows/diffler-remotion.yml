name: Diffler Profile README + Remotion

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build diffler
        run: npm run build -w packages/diffler

      - name: Update profile README and remotion config
        uses: ./packages/diffler
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          remotion-output: packages/remotion/input.json
          commit-message: "🤖 Auto-update profile README and remotion config"

      - name: Upload remotion config
        if: steps.update-readme.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: remotion-input
          path: packages/remotion/input.json
