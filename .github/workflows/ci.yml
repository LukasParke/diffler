name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:package

      - name: Verify committed action bundle is fresh
        run: |
          pnpm --filter @lukasparke/diffler build:action
          git diff --exit-code packages/diffler/dist-action

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Smoke test animated card rendering
        env:
          STATS_JSON_FILE: packages/remotion/fixtures/github-user-stats.json
          RENDER_CARD_CONCURRENCY: 1
          REMOTION_CONCURRENCY: 4
        run: pnpm --filter @lukasparke/diffler-remotion test:render
